<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Graph / Map view — dev harness</title>
<!-- Resolve theme before first paint, same policy as the real app. -->
<script src="/dev/theme-boot.js"></script>
<!-- Base tokens/theme FIRST, then the graph styles. -->
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/graph.css">
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); }
  .harness-bar {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .harness-bar h1 { font-size:15px; margin:0; font-weight:700; }
  .harness-bar .note { font-size:12.5px; color:var(--muted); }
  .harness-bar button {
    height:32px; padding:0 12px; cursor:pointer; font-size:13px;
    background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
  }
  .harness-bar button:hover { background:var(--surface-2); border-color:var(--accent); color:var(--accent); }
  .harness-bar .spacer { flex:1; }
  #log { font-size:12.5px; color:var(--accent); min-width:160px; }
  #stage { flex:1; min-height:0; position:relative; }
</style>
</head>
<body>
<div class="harness-bar">
  <h1>Map view — dev harness</h1>
  <!-- No zoom buttons, search box, legend or minimap on the stage: this harness
       drives the BARE engine (createGraphController), and all of that is the
       app's chrome, not the graph's. These buttons stand in for it. -->
  <span class="note">Wheel = zoom · drag = pan · click a node = open</span>
  <div class="spacer"></div>
  <span id="log" aria-live="polite"></span>
  <button id="fitBtn">Fit</button>
  <button id="findBtn">Find “deploy”</button>
  <button id="themeBtn">Toggle theme</button>
</div>
<div id="stage"></div>

<script type="module" src="/dev/graph-demo.js"></script>
</body>
</html>
