[pytest]
# The app is served (by serve.py, or a fallback static server) at this origin.
# pytest-base-url (pulled in by pytest-playwright) exposes this as the `base_url`
# fixture, so page.goto("/#/...") resolves against it.
base_url = http://127.0.0.1:8017

# Run Playwright's own Chromium headless by default. Override on the command
# line with:  pytest --headed --slowmo 300
addopts = -ra --browser chromium

markers =
    conformance: CommonMark spec.json conformance measurement (informational, non-gating)
    e2e: end-to-end browser tests of stable app behaviour
