# Validation on every push and pull request.
#
# The repository carries NO compiled output, so every job here has to build
# before it can do anything - that is the trade taken when app/js/ and
# app/build/ stopped being committed. The build is a few hundred milliseconds;
# it is not the expensive part.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # tsc over src/** at strict, then svelte-check over the components.
      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Component tests
        run: npm test

      # The build must succeed AND be reproducible. Byte-identical output on a
      # second run is what makes a release artifact trustworthy: if two builds of
      # the same commit differ, the tarball a user downloads is not the tree the
      # commit describes.
      - name: Build twice and compare
        run: |
          npm run build
          sha256sum app/build/islands.js > /tmp/first.sha
          find app/js -name '*.js' -exec sha256sum {} + | sort >> /tmp/first.sha
          npm run build
          sha256sum app/build/islands.js > /tmp/second.sha
          find app/js -name '*.js' -exec sha256sum {} + | sort >> /tmp/second.sha
          diff /tmp/first.sha /tmp/second.sha || {
            echo "::error::The build is not reproducible - two runs of the same commit produced different output."
            exit 1
          }

  test:
    name: End-to-end suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Node is needed only to PRODUCE app/js and app/build. Once they exist the
      # suite drives the real serve.py, which stays standard-library-only.
      - run: npm ci
      - run: npm run build

      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - run: python -m pytest tests -q

  python_only:
    name: Runs on Python alone (sys_9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Build the release payload exactly as the release job does...
      - run: npm ci
      - run: npm run build
      - name: Assemble the runnable tree
        run: bash scripts/make-release.sh /tmp/webdoc

      # ...then prove it needs nothing but Python. node and npm are removed from
      # PATH and node_modules is left behind, so anything reaching for a
      # toolchain fails here rather than in a user's hands.
      - name: Start it with no Node available
        run: |
          cd /tmp/webdoc
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -E 'node|npm' | paste -sd:)"
          ! command -v node || { echo "::error::node is still on PATH; this job proves nothing"; exit 1; }
          python3 serve.py --port 8123 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8123/api/index/status >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8123/ | grep -q 'id="content"' || { echo "::error::index.html did not serve"; exit 1; }
          curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8123/js/main.js | grep -q '^200$' || {
            echo "::error::/js/main.js is missing - the release tree is not runnable"; exit 1; }
          curl -sf -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8123/build/islands.js | grep -q '^200$' || {
            echo "::error::/build/islands.js is missing - the release tree is not runnable"; exit 1; }
          echo "Served on Python alone."
